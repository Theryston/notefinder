services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notefinder
      POSTGRES_USER: notefinder
      # Keep this value outside the repository. `openssl rand -hex 32` generates
      # a strong URL-safe password for use in .env.prod.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notefinder -d notefinder']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '5687:5432'
    volumes:
      - notefinder_postgres_data_v18:/var/lib/postgresql

  app:
    image: ghcr.io/theryston/notefinder@sha256:7c85c7d86c4d59d18650ccf507d72e23329117e83bb014153b0b292be0f1fb79
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.prod
        required: false
    environment:
      # DATABASE_URL must use the Compose service name so the app reaches the
      # PostgreSQL container instead of an external database.
      DATABASE_URL: 'postgresql://notefinder:${POSTGRES_PASSWORD}@postgres:5432/notefinder?schema=public'
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?AUTH_GOOGLE_ID must be set}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?AUTH_GOOGLE_SECRET must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:?AUTH_URL must be set}
      CUSTOM_AWS_ACCESS_KEY: ${CUSTOM_AWS_ACCESS_KEY:?CUSTOM_AWS_ACCESS_KEY must be set}
      CUSTOM_AWS_BUCKET_NAME: ${CUSTOM_AWS_BUCKET_NAME:?CUSTOM_AWS_BUCKET_NAME must be set}
      CUSTOM_AWS_REGION_NAME: ${CUSTOM_AWS_REGION_NAME:?CUSTOM_AWS_REGION_NAME must be set}
      CUSTOM_AWS_SECRET_ACCESS_KEY: ${CUSTOM_AWS_SECRET_ACCESS_KEY:?CUSTOM_AWS_SECRET_ACCESS_KEY must be set}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}
      NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID: ${NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID:-}
      NFP_AUDIO_QUEUE_URL: ${NFP_AUDIO_QUEUE_URL:?NFP_AUDIO_QUEUE_URL must be set}
      NIXPACKS_NODE_VERSION: ${NIXPACKS_NODE_VERSION:-24}
      NOTEFINDER_YTMUSIC_API_URL: ${NOTEFINDER_YTMUSIC_API_URL:?NOTEFINDER_YTMUSIC_API_URL must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      PRIVATE_ROUTES_API_KEY: ${PRIVATE_ROUTES_API_KEY:?PRIVATE_ROUTES_API_KEY must be set}
      RAPIDAPI_API_KEY: ${RAPIDAPI_API_KEY:?RAPIDAPI_API_KEY must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:?RUNPOD_API_KEY must be set}
      RUNPOD_SERVERLESS_ID: ${RUNPOD_SERVERLESS_ID:?RUNPOD_SERVERLESS_ID must be set}
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY:?TRIGGER_SECRET_KEY must be set}
    ports:
      - '9301:3000'

volumes:
  notefinder_postgres_data_v18:
