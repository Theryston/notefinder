services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notefinder
      POSTGRES_USER: notefinder
      # Keep this value outside the repository. `openssl rand -hex 32` generates
      # a strong URL-safe password for use in .env.prod.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notefinder -d notefinder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - notefinder_postgres_data:/var/lib/postgresql/data

  app:
    image: ghcr.io/theryston/notefinder@sha256:090814a52e4a1ab4804e611c6c94af636b3c2feeb40ebcbf40ca786080e809a2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: "postgresql://notefinder:${POSTGRES_PASSWORD}@postgres:5432/notefinder?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  notefinder_postgres_data:
