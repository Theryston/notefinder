name: Publish Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - docker-compose.prod.yml
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}

      - name: Pin production Compose to pushed image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi

          image="ghcr.io/theryston/notefinder@${IMAGE_DIGEST}"
          sed -E -i "s|^([[:space:]]*image:[[:space:]]*)ghcr\\.io/theryston/notefinder(@sha256:[0-9a-f]+)?[[:space:]]*$|\\1${image}|" docker-compose.prod.yml

          if ! grep -qF "${image}" docker-compose.prod.yml; then
            echo "Could not update docker-compose.prod.yml" >&2
            exit 1
          fi

          if git diff --quiet -- docker-compose.prod.yml; then
            echo "Production Compose already points to ${image}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.prod.yml
          git commit -m "chore: pin production image to ${IMAGE_DIGEST} [skip ci]"
          git push
  deploy-fly:
    name: Deploy app to fly.io
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >-
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
