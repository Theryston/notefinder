name: Publish Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - docker-compose.prod.yml
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notefinder
          POSTGRES_USER: notefinder
          POSTGRES_PASSWORD: notefinder-build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notefinder -d notefinder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare build database
        env:
          DATABASE_URL: postgresql://notefinder:notefinder-build@127.0.0.1:5432/notefinder?schema=public
        run: pnpm db:migrate:deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          add-hosts: host.docker.internal=host-gateway
          secrets: |
            DATABASE_URL=postgresql://notefinder:notefinder-build@host.docker.internal:5432/notefinder?schema=public
            RESEND_API_KEY=build-only

      - name: Pin production Compose to pushed image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi

          image="ghcr.io/theryston/notefinder@${IMAGE_DIGEST}"
          sed -E -i "s|^([[:space:]]*image:[[:space:]]*)ghcr\\.io/theryston/notefinder(@sha256:[0-9a-f]+)?[[:space:]]*$|\\1${image}|" docker-compose.prod.yml

          if ! grep -qF "${image}" docker-compose.prod.yml; then
            echo "Could not update docker-compose.prod.yml" >&2
            exit 1
          fi

          if git diff --quiet -- docker-compose.prod.yml; then
            echo "Production Compose already points to ${image}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.prod.yml
          git commit -m "chore: pin production image to ${IMAGE_DIGEST} [skip ci]"
          git push
  deploy-fly:
    name: Deploy app to fly.io
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >-
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
